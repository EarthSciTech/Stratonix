# Worked example 17: a salt pillow and its withdrawal basin. A 250 m pillow grew from a 250 m source
# layer, withdrawing salt from a 2.5 km ring around it; the overburden drapes the pillow, subsides over
# the ring, and the syn-kinematic units (H2 to H4) thin over the crest and thicken into the basin
# (stage 2D). DESIGN model; every parameter carries value, unit, evidence and source.
stratonix_schema: 1
model: {name: example_salt_pillow, version: "1.0.0", status: DESIGN,
        title: "Salt pillow and withdrawal basin"}
crs: {name: "local engineering frame", epsg: 0, vertical_datum: "model datum, z = 0", length_unit: m}
domain:
  origin: "[0, 0] m | user_instruction | worked example"
  size:   "[10000, 10000] m | user_instruction | worked example"
  depth_range: "[0, 3000] m | user_instruction | worked example"
  grid_spacing: "50 m | user_instruction | worked example"
wells:
  - name: W1
    role: control
    head: "[800, 800] m | user_instruction | worked example: control well, outside the withdrawal ring"
    tops:
      H1: "800 m | user_instruction | worked example"
      H2: "1000 m | user_instruction | worked example"
      H3: "1150 m | user_instruction | worked example"
      H4: "1300 m | user_instruction | worked example"
      BS: "1800 m | user_instruction | worked example"
      H7: "2200 m | user_instruction | worked example"
  - name: W2
    role: planned
    head: "[5000, 5000] m | user_instruction | worked example: planned well on the pillow crest"
    total_depth: "2400 m | user_instruction | worked example"
  - name: W3
    role: planned
    head: "[7700, 5000] m | user_instruction | worked example: planned well in the withdrawal basin"
    total_depth: "2400 m | user_instruction | worked example"
stratigraphy:
  reference: {well: W1}
  horizons: [{name: H1}, {name: H2}, {name: H3}, {name: H4}, {name: TS}, {name: BS}, {name: H7}]
  units:
    - {name: Post_kinematic, top: H1, base: H2}
    - {name: Syn_upper, top: H2, base: H3}
    - {name: Syn_lower, top: H3, base: H4}
    - {name: Pre_kinematic, top: H4, base: TS}
    - {name: Salt, top: TS, base: BS}
    - {name: Sub_salt, top: BS, base: H7}
structure:
  regional: {type: flat}
  salt:
    top: TS
    base: BS
    source_thickness: "250 m | user_instruction | worked example"
    bodies:
      - {type: pillow, name: P1, centre: "[5000, 5000] m | user_instruction | worked example", radius: "1800 m | user_instruction | worked example", height: "250 m | user_instruction | worked example",
         withdrawal_width: "2500 m | user_instruction | worked example", growth: {onset: H4, end: H2}}
outputs:
  sections:
    - name: XS_EW
      polyline: "[[200, 5000], [9800, 5000]] m | user_instruction | worked example: across crest and basin"
  vertical_exaggeration: "3 ratio | user_instruction | worked example"
  exports: [petrel, vtk]
