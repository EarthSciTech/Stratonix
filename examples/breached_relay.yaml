# Stage 4B example (STX-TN-15 section 2.4, I-023): the relay of example 7 between two overlapping
# normal faults, breached. 'relay: {fault: F3, breached: true}' builds the connecting fault across the
# ramp at the middle of the overlap: the younger fault abuts it and it abuts the older one, so the
# throw passes from F1 to F3 through the breach. DESIGN model; every parameter carries value, unit,
# evidence and source.
stratonix_schema: 1
model: {name: breached_relay, version: "1.0.0", status: DESIGN,
        title: "Breached relay between two overlapping normal faults"}
crs: {name: "local engineering frame", epsg: 0, vertical_datum: "model datum, z = 0", length_unit: m}
domain:
  origin: "[0, 0] m | user_instruction | worked example"
  size:   "[10000, 10000] m | user_instruction | worked example"
  depth_range: "[0, 3000] m | user_instruction | worked example"
  grid_spacing: "50 m | user_instruction | worked example"
wells:
  - name: W1
    role: control
    head: "[1000, 1000] m | user_instruction | worked example: control well, fixed block"
    tops:
      H1: "1000 m | user_instruction | worked example"
      H2: "1200 m | user_instruction | worked example"
      H3: "1400 m | user_instruction | worked example"
      H4: "1600 m | user_instruction | worked example"
stratigraphy:
  reference: {well: W1}
  horizons: [{name: H1, intended_offset: true}, {name: H2}, {name: H3}, {name: H4, intended_offset: true}]
  units:
    - {name: Unit_1, top: H1, base: H2}
    - {name: Unit_2, top: H2, base: H3}
    - {name: Unit_3, top: H3, base: H4}
structure:
  regional: {type: flat}
faults:
  - name: F1
    age: "1 ordinal | user_instruction | worked example: master fault"
    geometry:
      type: planar
      reference_point: "[5000, 3000] m | user_instruction | worked example"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "0 deg | user_instruction | worked example: dips east"
      dip: "60 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: free}
      lower_tip: {rule: free}
      length: "8000 m | user_instruction | worked example: from 1 km south of the model to y = 7000 m"
    throw:
      max: "120 m | user_instruction | worked example"
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: flat_topped, taper: "0.1 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
    relay: {fault: F3, breached: true}
  - name: F3
    age: "2 ordinal | user_instruction | worked example: takes over F1's throw to the north"
    geometry:
      type: planar
      reference_point: "[6500, 9000] m | user_instruction | worked example: stepped 1.5 km east"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "0 deg | user_instruction | worked example"
      dip: "60 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: free}
      lower_tip: {rule: free}
      length: "8000 m | user_instruction | worked example: from y = 5000 m to 1 km north of the model"
    throw:
      max: "120 m | user_instruction | worked example"
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: flat_topped, taper: "0.1 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
frame: {fixed: {well: W1}}
outputs:
  sections:
    - name: XS_EW
      polyline: "[[3000, 6000], [9000, 6000]] m | user_instruction | worked example: across the breach"
  vertical_exaggeration: "3 ratio | user_instruction | worked example"
  exports: [petrel, vtk, csv]
