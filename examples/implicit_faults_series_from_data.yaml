# Stage 3A example (STX-TN-11): Unconformity, onlap and a fault rebuilt from data: one field per series, throw from the data.
# The data were sampled from the parametric example data/implicit_faults_series/truth.yaml (model source_unconformity_faulted v1.0.0) with
#   stratonix export data/implicit_faults_series/truth.yaml -o out --formats gempy,fault_sticks_irap
# by tools/make_implicit_examples.py, and are rebuilt here from data alone.
stratonix_schema: 1
model: {name: implicit_faults_series_from_data, version: "1.0.0", status: DESIGN,
        title: "Unconformity, onlap and a fault rebuilt from data: one field per series, throw from the data"}
crs: {name: "local engineering frame", epsg: 0, vertical_datum: "model datum, z = 0", length_unit: m}
domain:
  origin: "[0, 0] m | user_instruction | worked example"
  size:   "[10000, 10000] m | user_instruction | worked example"
  depth_range: "[0, 2500] m | user_instruction | worked example"
  grid_spacing: "50 m | user_instruction | worked example"
inputs:
  - {id: POINTS, path: data/implicit_faults_series/surface_points.csv, role: surface points, sharing: shareable, source: "sampled from data/implicit_faults_series/truth.yaml (source_unconformity_faulted v1.0.0) every 250 m", evidence: user_instruction}
  - {id: ORIENT, path: data/implicit_faults_series/orientations.csv, role: orientations, sharing: shareable, source: "sampled from data/implicit_faults_series/truth.yaml (source_unconformity_faulted v1.0.0) every 250 m", evidence: user_instruction}
  - {id: STICKS_F1, path: data/implicit_faults_series/F1_sticks.dat, role: fault sticks, sharing: shareable, source: "sticks of F1 from data/implicit_faults_series/truth.yaml", evidence: user_instruction}
wells:
  - name: W1
    role: control
    head: "[1000, 1000] m | user_instruction | worked example: control well, west"
    tops:
      T:  "900 m | user_instruction | worked example"
      U:  "1100 m | user_instruction | worked example"
      B1: "1200 m | user_instruction | worked example"
      B2: "1300 m | user_instruction | worked example"
      C1: "1450 m | user_instruction | worked example"
      C2: "1650 m | user_instruction | worked example"
  - name: W2
    role: planned
    head: "[7000, 5000] m | user_instruction | worked example: planned well east of the subcrop of C1"
    total_depth: "2200 m | user_instruction | worked example"
  - name: W3
    role: planned
    head: "[2000, 5000] m | user_instruction | worked example: planned well west of the onlap"
    total_depth: "2200 m | user_instruction | worked example"
stratigraphy:
  reference: {well: W1}
  horizons:
    - {name: T, intended_offset: true}
    - {name: U}
    - {name: B1}
    - {name: B2}
    - {name: C1}
    - {name: C2}
    - {name: C3, intended_offset: true}
  units:
    - {name: Cover, top: T, base: U}
    - {name: B_upper, top: U, base: B1}
    - {name: B_lower, top: B1, base: B2}
    - {name: B_base, top: B2, base: C1}
    - {name: C_upper, top: C1, base: C2}
    - {name: C_lower, top: C2, base: C3}
  series:
    - {name: S3, horizons: [T, U], base: erosional}
    - {name: S2, horizons: [B1, B2], base: onlap}
    - {name: S1, horizons: [C1, C2, C3], base: conformable}
implicit:
  data:
    - {input: POINTS, kind: points, format: csv_points}
    - {input: ORIENT, kind: orientations, format: csv_orientations}
  use_well_tops: true
  kernel: cubic
  nugget: "0 m | assumed | exact interpolation of the data"
  surface_spacing: "100 m | assumed | twice the grid spacing"
  iterations: "10 ordinal | assumed | maximum restoration passes"
  vertical_stretch: "5 ratio | assumed | anisotropy: horizons vary slowly laterally compared with their spacing"
  isochore_horizons: [C3]
faults:
  - name: F1
    age: "1 ordinal | user_instruction | source model: one fault after the series"
    geometry: {type: sticks, input: STICKS_F1, input_format: irap_lines, fit: plane}
    throw:
      estimate: {band: "400 m | assumed | data within 400 m of the fault", station_spacing: "250 m | assumed | the data spacing"}
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | source model"}
      profile_strike: {type: elliptical}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
frame: {fixed: {well: W1}}
outputs:
  sections:
    - name: XS_EW
      polyline: "[[200, 5000], [9800, 5000]] m | user_instruction | worked example: across onlap and subcrop"
    - name: XS_SN
      polyline: "[[2000, 200], [2000, 9800]] m | user_instruction | worked example: across the pinch-out"
  vertical_exaggeration: "4 ratio | user_instruction | worked example"
  exports: [petrel, vtk]
