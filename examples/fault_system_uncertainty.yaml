# Worked example 25 (stage 3C): the fault system of example 7 with uncertain throws, a correlated
# relay, an uncertain well top and a scenario with and without the splay F2. `stratonix ensemble`
# runs 200 seeded members; every member's checks are recorded, and the sensitivity should rank each
# fault's own throw first for that fault's maximum throw (STX-TN-13 section 8).
stratonix_schema: 1
model: {name: example_fault_system_uncertainty, version: "1.0.0", status: DESIGN,
        title: "Fault system with uncertain throws and an uncertain splay"}
crs: {name: "local engineering frame", epsg: 0, vertical_datum: "model datum, z = 0", length_unit: m}
domain:
  origin: "[0, 0] m | user_instruction | worked example"
  size:   "[12000, 12000] m | user_instruction | worked example"
  depth_range: "[0, 2500] m | user_instruction | worked example"
  grid_spacing: "50 m | user_instruction | worked example"
wells:
  - name: W1
    role: control
    head: "[1500, 3000] m | user_instruction | worked example: control well in the footwall"
    tops:
      H1: "1000 m | user_instruction | worked example"
      H2: "1200 m | user_instruction | worked example"
      H3: "1400 m | user_instruction | worked example"
      H4: "1600 m | user_instruction | worked example"
stratigraphy:
  reference: {well: W1}
  horizons: [{name: H1, intended_offset: true}, {name: H2}, {name: H3}, {name: H4, intended_offset: true}]   # the faults cut top and base on purpose
  units:
    - {name: Overburden, top: model_top, base: H1, clay_fraction: "0.60 fraction | assumed | worked example: shale above H1 (for the gouge window)"}
    - {name: Unit_1, top: H1, base: H2, clay_fraction: "0.15 fraction | assumed | worked example: clean sand"}
    - {name: Unit_2, top: H2, base: H3, clay_fraction: "0.70 fraction | assumed | worked example: shale"}
    - {name: Unit_3, top: H3, base: H4, clay_fraction: "0.20 fraction | assumed | worked example: sand"}
    - {name: Underburden, top: H4, base: model_base, clay_fraction: "0.40 fraction | assumed | worked example: below H4 (for the gouge window)"}
  # Stage 3B: porosity of the grid cells follows these compaction laws (present-day geometry as given).
  compaction:
    geometry: present
    surface_depth: "0 m | user_instruction | worked example"
    units:
      - {unit: Unit_1, law: exponential, surface_porosity: "0.49 fraction | literature_derived | Sclater and Christie (1980), Table 2, sandstone", decay: "0.27 1/km | literature_derived | Sclater and Christie (1980), Table 2, sandstone"}
      - {unit: Unit_2, law: exponential, surface_porosity: "0.63 fraction | literature_derived | Sclater and Christie (1980), Table 2, shale", decay: "0.51 1/km | literature_derived | Sclater and Christie (1980), Table 2, shale"}
      - {unit: Unit_3, law: exponential, surface_porosity: "0.49 fraction | literature_derived | Sclater and Christie (1980), Table 2, sandstone", decay: "0.27 1/km | literature_derived | Sclater and Christie (1980), Table 2, sandstone"}
structure:
  regional: {type: flat}
faults:
  - name: F1
    age: "1 ordinal | user_instruction | worked example: master fault"
    geometry:
      type: planar
      reference_point: "[5000, 3000] m | user_instruction | worked example"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "0 deg | user_instruction | worked example: dips east"
      dip: "60 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: free}
      lower_tip: {rule: free}
      length: "8000 m | user_instruction | worked example: from 1 km south of the model to y = 7000 m"
    throw:
      max: "120 m | user_instruction | worked example"
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: flat_topped, taper: "0.1 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
    relay: {fault: F3}
  - name: F3
    age: "2 ordinal | user_instruction | worked example: takes over F1's throw to the north"
    geometry:
      type: planar
      reference_point: "[6500, 9000] m | user_instruction | worked example: stepped 1.5 km east"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "0 deg | user_instruction | worked example"
      dip: "60 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: free}
      lower_tip: {rule: free}
      length: "8000 m | user_instruction | worked example: from y = 5000 m to 1 km north of the model"
    throw:
      max: "120 m | user_instruction | worked example"
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: flat_topped, taper: "0.1 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
  - name: F2
    age: "3 ordinal | user_instruction | worked example: splay, youngest"
    geometry:
      type: planar
      reference_point: "[5250, 2500] m | user_instruction | worked example"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "15 deg | user_instruction | worked example"
      dip: "75 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: free}
      lower_tip: {rule: free}
      length: "5000 m | user_instruction | worked example"
    throw:
      max: "50 m | user_instruction | worked example"
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: sine}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
    abuts: {fault: F1, side: hanging_wall, transfer: true}
frame: {fixed: {well: W1}}
outputs:
  sections:
    - name: XS_South
      polyline: "[[500, 2500], [11500, 2500]] m | user_instruction | worked example: across master and splay"
    - name: XS_Relay
      polyline: "[[500, 6000], [11500, 6000]] m | user_instruction | worked example: across the relay ramp"
  vertical_exaggeration: "2 ratio | user_instruction | worked example"
  exports: [petrel]
uncertainty:
  members: "200 ordinal | user_instruction | worked example: ensemble size"
  seed: "20261115 ordinal | user_instruction | worked example: recorded in the manifest"
  parameters:
    - {path: faults.F1.throw.max, distribution: normal, mean: "120 m | assumed | worked example", sd: "15 m | assumed | worked example",
       min: "60 m | assumed | worked example: truncation"}
    - {path: faults.F3.throw.max, distribution: triangular, min: "90 m | assumed | worked example", mode: "120 m | assumed | worked example",
       max: "150 m | assumed | worked example"}
    - {path: faults.F2.throw.max, distribution: uniform, min: "30 m | assumed | worked example", max: "70 m | assumed | worked example"}
    - {path: wells.W1.tops.H2, distribution: uniform, min: "1180 m | assumed | worked example: pick uncertainty",
       max: "1220 m | assumed | worked example: pick uncertainty"}
  correlations:
    - {a: faults.F1.throw.max, b: faults.F3.throw.max, rho: "0.6 ratio | assumed | worked example: the relay shares its throw"}
  scenarios:
    - name: splay
      options:
        - {name: with_F2, weight: "0.7 fraction | assumed | worked example"}
        - {name: without_F2, weight: "0.3 fraction | assumed | worked example", remove: [faults.F2]}
  one_at_a_time: true
  probability_maps:
    - {kind: unit, unit: Unit_1, depth: "1150 m | user_instruction | worked example", spacing: "200 m | user_instruction | worked example"}
    - {kind: unit, unit: Unit_2, depth: "1350 m | user_instruction | worked example", spacing: "200 m | user_instruction | worked example"}
