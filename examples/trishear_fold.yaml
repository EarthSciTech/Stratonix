# Worked example 11: a blind thrust dipping 45 degrees east whose tip propagated from about 1570 m to 1250 m
# depth; the layers ahead of the tip are folded by trishear (apical angle 50 degrees, P/S 1.5) into an
# asymmetric anticline with a steep forelimb (stage 2B).
# DESIGN model; every parameter carries value, unit, evidence and source.
stratonix_schema: 1
model: {name: example_trishear, version: "1.0.0", status: DESIGN,
        title: "Trishear fault-propagation fold"}
crs: {name: "local engineering frame", epsg: 0, vertical_datum: "model datum, z = 0", length_unit: m}
domain:
  origin: "[0, 0] m | user_instruction | worked example"
  size:   "[10000, 10000] m | user_instruction | worked example"
  depth_range: "[0, 3000] m | user_instruction | worked example"
  grid_spacing: "50 m | user_instruction | worked example"
wells:
  - name: W1
    role: control
    head: "[1000, 1000] m | user_instruction | worked example: control well, fixed block"
    tops:
      H1: "1000 m | user_instruction | worked example"
      H2: "1200 m | user_instruction | worked example"
      H3: "1400 m | user_instruction | worked example"
      H4: "1600 m | user_instruction | worked example"
  - name: W2
    role: planned
    head: "[4500, 5000] m | user_instruction | worked example: planned well on the forelimb"
    total_depth: "2000 m | user_instruction | worked example"
stratigraphy:
  reference: {well: W1}
  horizons: [{name: H1}, {name: H2}, {name: H3, intended_offset: true}, {name: H4, intended_offset: true}]
  units:
    - {name: Unit_1, top: H1, base: H2}
    - {name: Unit_2, top: H2, base: H3}
    - {name: Unit_3, top: H3, base: H4}
structure:
  regional: {type: flat}
faults:
  - name: F1
    age: "1 ordinal | user_instruction | worked example"
    geometry:
      type: planar
      reference_point: "[5000, 5000] m | user_instruction | worked example"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "0 deg | user_instruction | worked example: dips east"
      dip: "45 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: depth, depth: "1250 m | user_instruction | worked example: present tip, below H2"}
      lower_tip: {rule: free}
      length: "100000 m | user_instruction | worked example: longer than the model"
    throw:
      max: "212.132 m | user_instruction | worked example: vertical component of 300 m slip"
      sense: reverse
      profile_strike: {type: flat_topped, taper: "0.01 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
    fold:
      type: trishear
      apical_angle: "50 deg | literature_derived | Allmendinger (1998): typical 30 to 100 degrees"
      propagation_slip_ratio: "1.5 ratio | literature_derived | Allmendinger (1998): typical 1 to 3"
frame: {fixed: {well: W1}}
outputs:
  sections:
    - name: XS_EW
      polyline: "[[500, 5000], [9500, 5000]] m | user_instruction | worked example: across the fold"
  vertical_exaggeration: "2 ratio | user_instruction | worked example"
  exports: [petrel, vtk]
