# Stage 3A example (STX-TN-11): Relay and splay fault system rebuilt from sampled data, throws estimated from the data.
# The data were sampled from the parametric example fault_system_relay_splay.yaml (model example_fault_system v1.1.0) with
#   stratonix export fault_system_relay_splay.yaml -o out --formats gempy,fault_sticks_irap
# by tools/make_implicit_examples.py, and are rebuilt here from data alone.
stratonix_schema: 1
model: {name: implicit_relay_splay_from_samples, version: "1.0.0", status: DESIGN,
        title: "Relay and splay fault system rebuilt from sampled data, throws estimated from the data"}
crs: {name: "local engineering frame", epsg: 0, vertical_datum: "model datum, z = 0", length_unit: m}
domain:
  origin: "[0, 0] m | user_instruction | worked example"
  size:   "[12000, 12000] m | user_instruction | worked example"
  depth_range: "[0, 2500] m | user_instruction | worked example"
  grid_spacing: "50 m | user_instruction | worked example"
inputs:
  - {id: POINTS, path: data/implicit_relay_splay/surface_points.csv, role: surface points, sharing: shareable, source: "sampled from fault_system_relay_splay.yaml (example_fault_system v1.1.0) every 250 m", evidence: user_instruction}
  - {id: ORIENT, path: data/implicit_relay_splay/orientations.csv, role: orientations, sharing: shareable, source: "sampled from fault_system_relay_splay.yaml (example_fault_system v1.1.0) every 250 m", evidence: user_instruction}
  - {id: STICKS_F1, path: data/implicit_relay_splay/F1_sticks.dat, role: fault sticks, sharing: shareable, source: "sticks of F1 from fault_system_relay_splay.yaml", evidence: user_instruction}
  - {id: STICKS_F3, path: data/implicit_relay_splay/F3_sticks.dat, role: fault sticks, sharing: shareable, source: "sticks of F3 from fault_system_relay_splay.yaml", evidence: user_instruction}
wells:
  - name: W1
    role: control
    head: "[1500, 3000] m | user_instruction | worked example: control well in the footwall"
    tops:
      H1: "1000 m | user_instruction | worked example"
      H2: "1200 m | user_instruction | worked example"
      H3: "1400 m | user_instruction | worked example"
      H4: "1600 m | user_instruction | worked example"
stratigraphy:
  reference: {well: W1}
  horizons: [{name: H1, intended_offset: true}, {name: H2}, {name: H3}, {name: H4, intended_offset: true}]   # the faults cut top and base on purpose
  units:
    - {name: Unit_1, top: H1, base: H2, clay_fraction: "0.15 fraction | assumed | worked example: clean sand"}
    - {name: Unit_2, top: H2, base: H3, clay_fraction: "0.70 fraction | assumed | worked example: shale"}
    - {name: Unit_3, top: H3, base: H4, clay_fraction: "0.20 fraction | assumed | worked example: sand"}
implicit:
  data:
    - {input: POINTS, kind: points, format: csv_points}
    - {input: ORIENT, kind: orientations, format: csv_orientations}
  use_well_tops: true
  kernel: cubic
  nugget: "0 m | assumed | exact interpolation of the data"
  surface_spacing: "100 m | assumed | twice the grid spacing"
  iterations: "10 ordinal | assumed | maximum restoration passes"
  vertical_stretch: "5 ratio | assumed | anisotropy: horizons vary slowly laterally compared with their spacing"
faults:
  - name: F1
    age: "1 ordinal | user_instruction | worked example: master fault"
    geometry: {type: sticks, input: STICKS_F1, input_format: irap_lines, fit: plane}
    throw:
      estimate: {band: "600 m | assumed | data within 600 m of the fault", station_spacing: "250 m | assumed | the data spacing"}
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: flat_topped, taper: "0.1 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
    relay: {fault: F3}
  - name: F3
    age: "2 ordinal | user_instruction | worked example: takes over F1's throw to the north"
    geometry: {type: sticks, input: STICKS_F3, input_format: irap_lines, fit: plane}
    throw:
      estimate: {band: "600 m | assumed | data within 600 m of the fault", station_spacing: "250 m | assumed | the data spacing"}
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: flat_topped, taper: "0.1 fraction | user_instruction | worked example"}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
  - name: F2
    age: "3 ordinal | user_instruction | worked example: splay, youngest"
    geometry:
      type: planar
      reference_point: "[5250, 2500] m | user_instruction | worked example"
      reference_depth: "1300 m | user_instruction | worked example"
      strike: "15 deg | user_instruction | worked example"
      dip: "75 deg | user_instruction | worked example"
    extent:
      upper_tip: {rule: free}
      lower_tip: {rule: free}
      length: "5000 m | user_instruction | worked example"
    throw:
      max: "50 m | user_instruction | worked example"
      profile_dip: {type: flat_topped, taper: "0.25 fraction | user_instruction | worked example"}
      profile_strike: {type: sine}
    slip_mode: dip_slip
    hanging_wall: {type: rigid}
    abuts: {fault: F1, side: hanging_wall, transfer: true}
frame: {fixed: {well: W1}}
# Stage 2F: faults as rock and the stress field (STX-TN-10).
outputs:
  sections:
    - name: XS_South
      polyline: "[[500, 2500], [11500, 2500]] m | user_instruction | worked example: across master and splay"
    - name: XS_Relay
      polyline: "[[500, 6000], [11500, 6000]] m | user_instruction | worked example: across the relay ramp"
  vertical_exaggeration: "2 ratio | user_instruction | worked example"
  exports: [petrel, vtk, csv]
