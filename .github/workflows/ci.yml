# Continuous integration: Windows (MSVC, vcpkg) and Linux (GCC, Clang, sanitisers), release and
# debug; packages (portable zip, Windows installer, Linux archive) on every push to main.
name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # On a version tag only the release configurations run (the full matrix already ran on main);
  # the slow Debug and sanitiser legs skip their steps there so the release is not held up.
  linux:
    runs-on: ubuntu-22.04   # oldest supported glibc (2.35) for the Linux archive
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-release, linux-gcc-debug, linux-clang-release, linux-asan]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: lukka/get-cmake@latest   # CMake >= 3.24 (Ubuntu 22.04 ships 3.22)
      - name: Install dependencies
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (matrix.preset == 'linux-gcc-debug' || matrix.preset == 'linux-asan')) }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build libyaml-dev libcairo2-dev zlib1g-dev clang python3-numpy python3-yaml python3-jsonschema python3-pil libsqlite3-dev libproj-dev
      # Stage 4C (STX-TN-16 section 4): the release build (packaged) carries the RESQML exporter
      # (FESAPI, built from source and cached), PROJ and SQLite; the Clang build carries PROJ, so the
      # coordinate transformations run against PROJ's own test values (D14) in two builds
      - name: FESAPI dependencies
        if: matrix.preset == 'linux-gcc-release'
        run: sudo apt-get install -y libhdf5-dev libminizip-dev libboost-dev uuid-dev
      - name: FESAPI revision
        if: matrix.preset == 'linux-gcc-release'
        id: fesapi
        run: echo "sha=$(git ls-remote https://github.com/F2I-Consulting/fesapi.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: matrix.preset == 'linux-gcc-release'
        id: fesapi-cache
        with:
          path: fesapi-install
          key: fesapi-${{ steps.fesapi.outputs.sha }}-ubuntu-22.04
      - name: Build FESAPI
        if: matrix.preset == 'linux-gcc-release' && steps.fesapi-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/F2I-Consulting/fesapi.git fesapi-src
          cmake -S fesapi-src -B fesapi-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/fesapi-install \
                -DMINIZIP_INCLUDE_DIR=/usr/include/minizip -DMINIZIP_LIBRARY_RELEASE=/usr/lib/x86_64-linux-gnu/libminizip.so \
                -DWITH_EXAMPLE=OFF -DWITH_JAVA_WRAPPING=OFF -DWITH_PYTHON_WRAPPING=OFF -DWITH_DOTNET_WRAPPING=OFF
          cmake --build fesapi-build --parallel
          cmake --install fesapi-build
          cp fesapi-src/LICENSE fesapi-install/LICENSE
      - name: FESAPI licence text (shipped with its library)
        if: matrix.preset == 'linux-gcc-release'
        run: test -f fesapi-install/LICENSE || curl -fsSL https://raw.githubusercontent.com/F2I-Consulting/fesapi/${{ steps.fesapi.outputs.sha }}/LICENSE -o fesapi-install/LICENSE
      - name: Configure
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (matrix.preset == 'linux-gcc-debug' || matrix.preset == 'linux-asan')) }}
        run: >-
          cmake --preset ${{ matrix.preset }}
          ${{ matrix.preset == 'linux-clang-release' && '-DSTRATONIX_WITH_PROJ=ON' || '' }}
          ${{ matrix.preset == 'linux-gcc-release' && format('-DSTRATONIX_WITH_PROJ=ON -DSTRATONIX_WITH_FESAPI=ON -DFESAPI_ROOT={0}/fesapi-install', github.workspace) || '' }}
      - name: Build
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (matrix.preset == 'linux-gcc-debug' || matrix.preset == 'linux-asan')) }}
        run: cmake --build --preset ${{ matrix.preset }} || cmake --build build/${{ matrix.preset }}
      - name: Test
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && (matrix.preset == 'linux-gcc-debug' || matrix.preset == 'linux-asan')) }}
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure -j 4
      - name: Package
        if: matrix.preset == 'linux-gcc-release'
        run: |
          cd build/${{ matrix.preset }} && cpack
          ./apps/stratonix/stratonix version
          # the packaged executable finds the shipped FESAPI library (RPATH $ORIGIN/../lib)
          mkdir -p /tmp/pkg && tar -xzf stratonix-*.tar.gz -C /tmp/pkg
          exe=$(find /tmp/pkg -name stratonix -type f | head -1)
          "$exe" version | tee /tmp/pkg/version.txt
          grep -q "RESQML 2.0.1 export (FESAPI): included" /tmp/pkg/version.txt
      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'linux-gcc-release'
        with:
          name: stratonix-linux
          path: build/${{ matrix.preset }}/stratonix-*.*

  # External cross-check of the stage 3A implicit examples against LoopStructural (STX-TN-11
  # section 11): installs LoopStructural and runs tests/tools/crosscheck_v3.py; the report is kept.
  crosscheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libyaml-dev libcairo2-dev zlib1g-dev
      - name: Build the command-line tool
        run: cmake --preset linux-gcc-release && cmake --build build/linux-gcc-release --target stratonix
      - name: Install LoopStructural
        run: python3 -m pip install --upgrade pip && python3 -m pip install "LoopStructural>=1.5,<2" pandas scipy numpy pyamg
      - name: Cross-check
        run: python3 tests/tools/crosscheck_v3.py build/linux-gcc-release/apps/stratonix/stratonix examples crosscheck_report --require-loopstructural
      # Stage 4A (STX-TN-14 section 10): LoopStructural's single-fold example, predicted by both codes
      - name: Fold example
        continue-on-error: true
        run: python3 tests/tools/ls_fold_v4.py build/linux-gcc-release/apps/stratonix/stratonix crosscheck_report
      - name: Gravity and magnetics against Harmonica
        continue-on-error: true
        run: |
          python3 -m pip install "harmonica>=0.6"
          python3 tests/tools/harmonica_v4.py build/linux-gcc-release/apps/stratonix/stratonix crosscheck_report --require-harmonica
      # Stage 4C (STX-TN-16 section 7): the LAS reader against lasio on its public example files,
      # the DLIS reader against dlisio on files written by dliswriter (test tools only)
      - name: Well logs against lasio and dlisio
        run: |
          python3 -m pip install lasio dlisio dliswriter
          git clone --depth 1 https://github.com/kinverarity1/lasio.git lasio-src
          python3 tests/tools/welldata_crosscheck.py build/linux-gcc-release/apps/stratonix/stratonix lasio-src/tests/examples crosscheck_report/welldata
      # Stage 4D (STX-TN-17 section 1.7): experimental variograms against GeostatsPy's gamv
      - name: Variograms against GeostatsPy
        run: |
          python3 -m pip install geostatspy
          python3 tests/tools/geostat_crosscheck.py build/linux-gcc-release/apps/stratonix/stratonix crosscheck_report/geostat
      # Stage 4C: the SEG-Y reader against segyio on files segyio writes and on the example volume
      - name: SEG-Y against segyio
        run: |
          python3 -m pip install segyio
          python3 tests/tools/segy_crosscheck.py build/linux-gcc-release/apps/stratonix/stratonix examples/data/time_depth/volume_twt.sgy crosscheck_report/segy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crosscheck-loopstructural
          path: crosscheck_report

  # Stage 3B: RESQML 2.0.1 grid export through FESAPI (built from source here), read back by
  # resqpy and validated against the RESQML schemas when they are provided (STX-TN-12 section 6).
  resqml:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libyaml-dev libcairo2-dev zlib1g-dev libhdf5-dev libminizip-dev libboost-dev uuid-dev
      - name: FESAPI revision
        id: fesapi
        run: echo "sha=$(git ls-remote https://github.com/F2I-Consulting/fesapi.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: fesapi-cache
        with:
          path: fesapi-install
          key: fesapi-${{ steps.fesapi.outputs.sha }}-ubuntu-22.04
      - name: Build FESAPI
        if: steps.fesapi-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/F2I-Consulting/fesapi.git fesapi-src
          cmake -S fesapi-src -B fesapi-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/fesapi-install \
                -DMINIZIP_INCLUDE_DIR=/usr/include/minizip -DMINIZIP_LIBRARY_RELEASE=/usr/lib/x86_64-linux-gnu/libminizip.so \
                -DWITH_EXAMPLE=OFF -DWITH_JAVA_WRAPPING=OFF -DWITH_PYTHON_WRAPPING=OFF -DWITH_DOTNET_WRAPPING=OFF
          cmake --build fesapi-build --parallel
          cmake --install fesapi-build
      - uses: actions/cache/save@v4
        if: steps.fesapi-cache.outputs.cache-hit != 'true'
        with:
          path: fesapi-install
          key: fesapi-${{ steps.fesapi.outputs.sha }}-ubuntu-22.04
      - name: FESAPI interface used by Stratonix (for the log)
        run: |
          grep -rn -A3 "createDiscreteProperty(\|createLocalDepth3dCrs(" fesapi-install/include/fesapi/common/DataObjectRepository.h | head -60 || true
          grep -rhn "setGeometryAsCoordinateLineNodes\|createLocalDepth3dCrs\|createDiscreteProperty\|createContinuousProperty\|Hdf5Array3dOfValues\|createHdfProxy\|setEnabledCells\|serializeFrom\|EpcDocument(" fesapi-install/include | head -80 || true
          find fesapi-install -name "*.so*" | head
      - name: Build Stratonix with FESAPI
        run: |
          cmake --preset linux-gcc-release -DSTRATONIX_WITH_FESAPI=ON -DFESAPI_ROOT=$PWD/fesapi-install
          cmake --build build/linux-gcc-release --target stratonix test_v3_grids
      - name: Export a grid as RESQML and GRDECL
        run: |
          export LD_LIBRARY_PATH=$PWD/fesapi-install/lib:$PWD/fesapi-install/lib64:$LD_LIBRARY_PATH
          build/linux-gcc-release/apps/stratonix/stratonix export examples/fault_system_relay_splay.yaml -o resqml_out --formats grdecl,resqml
          build/linux-gcc-release/tests/test_v3_grids G12
      # Stage 4C (STX-TN-16 section 4, I-034): the RESQML 2.0.1 schemas belong to Energistics and are
      # never committed; the owner supplies them to CI as a zip URL in the secret STX_RESQML_XSD_URL.
      # Without it every export reports "not validated: schemas not supplied", never a pass.
      - name: RESQML schemas (owner-supplied)
        env:
          XSD_URL: ${{ secrets.STX_RESQML_XSD_URL }}
        run: |
          if [ -n "$XSD_URL" ]; then
            mkdir -p "$RUNNER_TEMP/resqml_xsd" && curl -fsSL "$XSD_URL" -o "$RUNNER_TEMP/resqml_xsd.zip"
            unzip -q "$RUNNER_TEMP/resqml_xsd.zip" -d "$RUNNER_TEMP/resqml_xsd"
            echo "STX_RESQML_XSD_DIR=$RUNNER_TEMP/resqml_xsd" >> "$GITHUB_ENV"
            echo "STX_RESQML_XSD_REQUIRED=1" >> "$GITHUB_ENV"
          fi
      - name: Read back with resqpy and validate against the schemas
        run: |
          python3 -m pip install --upgrade pip && python3 -m pip install resqpy lxml
          export LD_LIBRARY_PATH=$PWD/fesapi-install/lib:$PWD/fesapi-install/lib64:$LD_LIBRARY_PATH
          python3 tests/tools/resqml_roundtrip.py resqml_out/exports
          echo "### RESQML exports of the synthetic examples" >> "$GITHUB_STEP_SUMMARY"
          echo "- fault_system_relay_splay: $(cat resqml_out/exports/xsd_status.txt)" >> "$GITHUB_STEP_SUMMARY"
          for ex in rift_inversion_history salt_sheet_drape polygonal_faults injectite_complex; do
            build/linux-gcc-release/apps/stratonix/stratonix export examples/$ex.yaml -o resqml_$ex --formats grdecl,resqml
            python3 tests/tools/resqml_roundtrip.py resqml_$ex/exports
            echo "- $ex: $(cat resqml_$ex/exports/xsd_status.txt)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resqml-grid
          path: resqml_out/exports/grid

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    env:
      VCPKG_ROOT: C:/vcpkg
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The vcpkg baseline is pinned in vcpkg.json once a networked run has produced it:
      #   vcpkg x-update-baseline --add-initial-baseline   (commit the result)
      # Stage 4C (STX-TN-16 section 4): the Release build (packaged) carries the RESQML exporter
      # (FESAPI built from source against vcpkg's HDF5, minizip and Boost, cached), PROJ and SQLite
      - name: FESAPI revision
        if: matrix.config == 'Release'
        id: fesapi
        shell: bash
        run: |
          echo "sha=$(git ls-remote https://github.com/F2I-Consulting/fesapi.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "vcpkg=$(git -C C:/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: matrix.config == 'Release'
        id: fesapi-cache
        with:
          path: |
            fesapi-install
            C:/vcpkg/installed
          key: fesapi-${{ steps.fesapi.outputs.sha }}-vcpkg-${{ steps.fesapi.outputs.vcpkg }}-windows-2022
      - name: Build FESAPI
        if: matrix.config == 'Release' && steps.fesapi-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          C:/vcpkg/vcpkg.exe install --classic --triplet x64-windows hdf5 minizip boost-uuid zlib
          git clone --depth 1 https://github.com/F2I-Consulting/fesapi.git fesapi-src
          cmake -S fesapi-src -B fesapi-build -G "Visual Studio 17 2022" -A x64 \
                -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-windows \
                -DMINIZIP_ROOT=C:/vcpkg/installed/x64-windows -DCMAKE_INSTALL_PREFIX=$PWD/fesapi-install \
                -DWITH_EXAMPLE=OFF -DWITH_JAVA_WRAPPING=OFF -DWITH_PYTHON_WRAPPING=OFF -DWITH_DOTNET_WRAPPING=OFF
          cmake --build fesapi-build --config Release --parallel
          cmake --install fesapi-build --config Release
          cp fesapi-src/LICENSE fesapi-install/LICENSE
          find fesapi-install -name "*.dll" -o -name "*.lib" | head
      - uses: actions/cache/save@v4
        if: matrix.config == 'Release' && steps.fesapi-cache.outputs.cache-hit != 'true'
        with:
          path: |
            fesapi-install
            C:/vcpkg/installed
          key: fesapi-${{ steps.fesapi.outputs.sha }}-vcpkg-${{ steps.fesapi.outputs.vcpkg }}-windows-2022
      - name: FESAPI licence text (shipped with its library)
        if: matrix.config == 'Release'
        shell: bash
        run: test -f fesapi-install/LICENSE || curl -fsSL https://raw.githubusercontent.com/F2I-Consulting/fesapi/${{ steps.fesapi.outputs.sha }}/LICENSE -o fesapi-install/LICENSE
      - name: FESAPI and its dependencies on the PATH (tests in the build tree)
        if: matrix.config == 'Release'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/fesapi-install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/fesapi-install/lib" >> "$GITHUB_PATH"
          echo "C:/vcpkg/installed/x64-windows/bin" >> "$GITHUB_PATH"
      - name: Configure (MSVC + vcpkg)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && matrix.config == 'Debug') }}
        shell: bash
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON
          ${{ matrix.config == 'Release' && format('"-DVCPKG_MANIFEST_FEATURES=proj;sqlite" -DSTRATONIX_WITH_PROJ=ON -DSTRATONIX_WITH_FESAPI=ON -DFESAPI_ROOT={0}/fesapi-install -DSTRATONIX_RUNTIME_DIRS=C:/vcpkg/installed/x64-windows/bin', github.workspace) || '' }}
      - name: Build
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && matrix.config == 'Debug') }}
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && matrix.config == 'Debug') }}
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -j 4
      - name: Package (zip and NSIS installer)
        if: matrix.config == 'Release'
        run: cd build && cpack -C Release
      - name: Clean-machine smoke test (fresh folder, PATH stripped)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/stratonix-*-win*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:/stx_clean
          $exe = Get-ChildItem C:/stx_clean -Recurse -Filter stratonix.exe | Select-Object -First 1
          $env:PATH = "C:/Windows/System32;C:/Windows"
          & $exe.FullName version
          & $exe.FullName validate examples/synthetic_fold_two_faults.yaml
          # the package carries the RESQML exporter and writes a grid with it
          $v = & $exe.FullName version | Out-String
          if ($v -notmatch "RESQML 2.0.1 export \(FESAPI\): included") { throw "the package does not include the RESQML exporter" }
          & $exe.FullName export examples/fault_system_relay_splay.yaml -o C:/stx_resqml --formats resqml
          if (-not (Get-ChildItem C:/stx_resqml -Recurse -Filter *.epc)) { throw "no RESQML file written" }
      - uses: actions/upload-artifact@v4
        if: matrix.config == 'Release'
        with:
          name: stratonix-windows
          path: |
            build/stratonix-*.zip
            build/stratonix-*.exe

  # Stage 4D (STX-TN-17 section 5, decision 25): Python wheels over the C API (ctypes), one per
  # platform, carrying the C library; tested against the command line's outputs.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build the C library and the program (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libyaml-dev libcairo2-dev zlib1g-dev
          cmake --preset linux-gcc-release -DSTRATONIX_BUILD_TESTS=OFF -DSTRATONIX_BUILD_BENCHMARKS=OFF
          cmake --build build/linux-gcc-release --target stratonix stratonix_c
          mkdir -p python/stratonix/_lib && cp -L build/linux-gcc-release/capi/libstratonix_c.so python/stratonix/_lib/
          echo "STRATONIX_EXE=$PWD/build/linux-gcc-release/apps/stratonix/stratonix" >> "$GITHUB_ENV"
      - name: Build the C library and the program (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
                -DVCPKG_TARGET_TRIPLET=x64-windows -DSTRATONIX_BUILD_TESTS=OFF -DSTRATONIX_BUILD_BENCHMARKS=OFF
          cmake --build build --config Release --target stratonix stratonix_c --parallel
          mkdir -p python/stratonix/_lib && cp build/capi/Release/*.dll python/stratonix/_lib/
          echo "STRATONIX_EXE=$PWD/build/apps/stratonix/Release/stratonix.exe" >> "$GITHUB_ENV"
      - name: Wheel
        shell: bash
        run: |
          grep -oP 'project\(stratonix VERSION \K[0-9.]+' CMakeLists.txt > python/VERSION
          python -m pip install --upgrade pip build wheel
          python -m build --wheel python --outdir dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install auditwheel patchelf
            auditwheel repair dist/*.whl --plat manylinux_2_35_x86_64 -w wheelhouse && rm dist/*.whl && mv wheelhouse/*.whl dist/
          fi
          ls dist
      - name: Install and test the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest numpy
          cd python/tests && STRATONIX_EXAMPLES=$GITHUB_WORKSPACE/examples python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ runner.os }}
          path: dist/*.whl
      # PyPI on a version tag, with the owner's token (a repository secret the owner sets; never in
      # the repository); without it the wheels stay on the run as artifacts
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then echo "PYPI_API_TOKEN not set: wheels kept as artifacts, not published"; exit 0; fi
          python -m pip install twine && python -m twine upload dist/*.whl

  # On a version tag: collect the Windows and Linux packages, write SHA256SUMS.txt, publish a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, python]
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Checksums
        run: cd dist && sha256sum stratonix-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stratonix-*
            dist/SHA256SUMS.txt
      # A release made here with GITHUB_TOKEN does not raise the "release published" event, so the
      # citation and container workflows are started explicitly (workflow_dispatch is allowed).
      - name: Update the citation and publish the container image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run citation.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
          gh workflow run container.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
