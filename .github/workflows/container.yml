# Container image of the command-line program, published to GitHub Packages (ghcr.io) when a
# release is published; can also be run by hand. The image is tested with the worked examples.
name: container
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stratonix
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: stratonix:test
      - name: Smoke test (validate and build a worked example)
        run: |
          docker run --rm stratonix:test version
          docker run --rm -v "$PWD/examples:/work" stratonix:test validate synthetic_fold_two_faults.yaml
          docker run --rm -v "$PWD/examples:/work" -v "$RUNNER_TEMP:/out" stratonix:test build synthetic_fold_two_faults.yaml -o /out/synthetic
          test -f "$RUNNER_TEMP/synthetic/manifest.json"
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
